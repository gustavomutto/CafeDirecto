<!DOCTYPE html>
<html lang="es">
<head>
  <!-- flutter build reemplaza este valor con --base-href (por defecto "/"). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CaféDirecto conecta a caficultores colombianos con compradores de café de especialidad: chat traducido, cotizaciones y acuerdos registrados.">
  <meta name="theme-color" content="#5B3A29">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CaféDirecto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CaféDirecto</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Color de fondo mientras carga la app (evita el destello blanco). */
    html, body { margin: 0; background: #2B1D14; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
