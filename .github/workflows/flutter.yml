name: App Flutter

on:
  push:
    branches: ['**'] # las etiquetas no disparan esta revisión; las versiones salen por "release"
    paths: ['mobile_app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['mobile_app/**']
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar-probar-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # solo lo usa el paso "Publicar versión" (adjuntar el APK al Release)
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: echo "::notice::$(flutter --version | head -1)"
      - run: flutter pub get

      # Cada paso publica sus problemas en UNA anotación (se ve en el resumen de la ejecución
      # y por la API de GitHub), además del registro completo.
      - name: Análisis del código (errores, advertencias e infos)
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          issues=$(grep -E "^ *(error|warning|info) " analyze.txt | head -300)
          if [ -n "$issues" ]; then echo "::error title=flutter analyze::$(printf '%s' "$issues" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
          exit $code

      - name: Pruebas
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            issues=$(grep -E "\[E\]|Error|Expected|Actual|\.dart [0-9]+:[0-9]+|FAILED" test.txt | head -120)
            echo "::error title=flutter test::$(printf '%s' "$issues" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $code

      # Firma de lanzamiento (H-04). Con los secretos del repositorio se firma con la clave propia.
      # Al publicar un Release es obligatoria: un APK público no va firmado con la clave de depuración.
      # Secretos (Settings → Secrets and variables → Actions): ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD (ver docs/PUBLICAR_EN_PLAY.md).
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/cafedirecto-release.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS:-cafedirecto}"
              echo "storeFile=../cafedirecto-release.jks"
            } > android/key.properties
            echo "::notice title=Firma::APK firmado con la clave de lanzamiento"
          elif [ "$EVENT" = "release" ]; then
            echo "::error title=Firma::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD. Un Release no se publica con la clave de depuración."
            exit 1
          else
            echo "::warning title=Firma::Sin clave de lanzamiento: este APK de prueba va firmado con la clave de depuración"
          fi

      - name: Construir APK
        env:
          REQUIRE_RELEASE_SIGNING: ${{ github.event_name == 'release' }}
        run: |
          set +e
          # --obfuscate: los nombres de clases y funciones de Dart no quedan legibles en el APK (H-03).
          # Los símbolos para leer los errores quedan aparte, en build/symbols (no van dentro del APK).
          flutter build apk --release --obfuscate --split-debug-info=build/symbols > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            issues=$(grep -E "error|Error|FAILURE|What went wrong" -A3 build.txt | head -120)
            echo "::error title=flutter build::$(printf '%s' "$issues" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $code

      - uses: actions/upload-artifact@v6
        with:
          name: cafedirecto-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Símbolos de la versión ofuscada: sin ellos los errores se ven como nombres sin sentido.
      #   flutter symbolize -i <error.txt> -d app.android-arm64.symbols
      - uses: actions/upload-artifact@v6
        with:
          name: cafedirecto-simbolos
          path: mobile_app/build/symbols
          retention-days: 90

      # Al publicar un Release (GitHub → Releases → Draft a new release → etiqueta v3.1.1 → Publish)
      # se adjunta el APK. Enlace fijo para descargar siempre la última versión, sin cuenta de GitHub:
      #   https://github.com/<dueño>/<repo>/releases/latest/download/CafeDirecto.apk
      - name: Publicar versión en Releases
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CafeDirecto.apk
          cat > notas.md <<'EOF'
          ## Instalar en Android

          1. Desde el celular, toca **CafeDirecto.apk** (abajo, en *Assets*) para descargarlo.
          2. Ábrelo. Si Android lo pide, permite **Instalar apps desconocidas** para el navegador.
          3. Si aparece Play Protect, toca **Más detalles → Instalar de todas formas** (la app aún no está en Play Store).
          4. Si ya tenías una versión anterior y dice *"La app no se instaló"*, desinstálala primero.
             No se pierde nada: los datos están en el servidor; solo vuelves a iniciar sesión.

          ## Entrar

          - **Crear cuenta**: elige *caficultor* o *comprador*. Contraseña de 8 o más caracteres con letras y números.
          - Los caficultores publican lotes desde **Inicio**; los compradores ven todos los lotes publicados en **Explorar**.
          EOF
          gh release upload "$TAG" CafeDirecto.apk --clobber
          # si el Release se publicó sin descripción, se ponen las instrucciones de instalación
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file notas.md
          fi
          echo "::notice title=APK publicado::https://github.com/$GH_REPO/releases/latest/download/CafeDirecto.apk"
