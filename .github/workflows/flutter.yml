name: App Flutter

on:
  push:
    paths: ['mobile_app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['mobile_app/**']
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analizar-probar-compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # solo lo usa el paso "Publicar versión" (crear el Release con el APK)
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: echo "::notice::$(flutter --version | head -1)"
      - run: flutter pub get

      # Cada paso publica sus problemas en UNA anotación (se ve en el resumen de la ejecución
      # y por la API de GitHub), además del registro completo.
      - name: Análisis del código (errores, advertencias e infos)
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          issues=$(grep -E "^ *(error|warning|info) " analyze.txt | head -300)
          if [ -n "$issues" ]; then echo "::error title=flutter analyze::$(printf '%s' "$issues" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; fi
          exit $code

      - name: Pruebas
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            issues=$(grep -E "\[E\]|Error|Expected|Actual|\.dart [0-9]+:[0-9]+|FAILED" test.txt | head -120)
            echo "::error title=flutter test::$(printf '%s' "$issues" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $code

      - name: Construir APK
        run: |
          set +e
          flutter build apk --release > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            issues=$(grep -E "error|Error|FAILURE|What went wrong" -A3 build.txt | head -120)
            echo "::error title=flutter build::$(printf '%s' "$issues" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $code

      - uses: actions/upload-artifact@v6
        with:
          name: cafedirecto-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Al subir una etiqueta vX.Y.Z (git tag v3.1.0 && git push origin v3.1.0) el APK se publica
      # en Releases. Enlace fijo para descargar siempre la última versión, sin cuenta de GitHub:
      #   https://github.com/<dueño>/<repo>/releases/latest/download/CafeDirecto.apk
      - name: Publicar versión en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk CafeDirecto.apk
          cat > notas.md <<'EOF'
          ## Instalar en Android

          1. Desde el celular, toca **CafeDirecto.apk** (abajo, en *Assets*) para descargarlo.
          2. Ábrelo. Si Android lo pide, permite **Instalar apps desconocidas** para el navegador.
          3. Si aparece Play Protect, toca **Más detalles → Instalar de todas formas** (la app aún no está en Play Store).
          4. Si ya tenías una versión anterior y dice *"La app no se instaló"*, desinstálala primero.
             No se pierde nada: los datos están en el servidor; solo vuelves a iniciar sesión.

          ## Entrar

          - **Crear cuenta**: elige *caficultor* o *comprador*. Contraseña de 8 o más caracteres con letras y números.
          - Los caficultores publican lotes desde **Inicio**; los compradores ven todos los lotes publicados en **Explorar**.
          EOF
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" CafeDirecto.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" CafeDirecto.apk --title "CaféDirecto $GITHUB_REF_NAME" --notes-file notas.md --latest
          fi
          echo "::notice title=APK publicado::https://github.com/$GH_REPO/releases/latest/download/CafeDirecto.apk"
