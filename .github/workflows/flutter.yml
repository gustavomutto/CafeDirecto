name: App Flutter

on:
  push:
    paths: ['mobile_app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['mobile_app/**']
  workflow_dispatch:

jobs:
  analizar-y-compilar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Análisis del código
        run: flutter analyze --no-fatal-infos
      - name: Pruebas
        run: flutter test
      - name: Construir APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cafedirecto-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
