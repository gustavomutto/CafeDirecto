name: Servidor

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: cafe
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm ci
      - name: Revisión de estilo y errores (ESLint)
        run: npx eslint .
      - name: Dependencias sin vulnerabilidades conocidas
        run: npm audit --omit=dev --audit-level=high
      - run: for f in $(find src -name '*.js'); do node --check $f; done
      - name: Pruebas de la API
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:pg@localhost:5432/cafe
